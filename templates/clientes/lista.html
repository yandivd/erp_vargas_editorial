{% extends 'base.html' %}

{% block title %}Directorio de Clientes - Vargas Editorial{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-0 fw-bold"><i class="bi bi-people text-primary"></i> Directorio de Clientes</h2>
        <p class="text-muted mb-0">Total de clientes registrados: <span id="total-clientes">{{ total_clientes }}</span></p>
    </div>
</div>

<!-- FILTROS Y TABLA -->
<div class="card card-kpi" id="contenedor-tabla-clientes">
    
    <!-- BARRA DE FILTROS -->
    <div class="p-3 border-bottom">
        <form id="formFiltrosClientes" class="row g-2 align-items-end">
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Nombre</label>
                <input type="text" name="nombre" class="form-control form-control-sm" placeholder="Buscar nombre..." value="{{ f_nombre }}">
            </div>
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Teléfono</label>
                <input type="text" name="telefono" class="form-control form-control-sm" placeholder="Buscar teléfono..." value="{{ f_telefono }}">
            </div>
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Email</label>
                <input type="text" name="email" class="form-control form-control-sm" placeholder="Buscar email..." value="{{ f_email }}">
            </div>
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Estado de deuda</label>
                <select name="deuda" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option value="con_deuda" {% if f_deuda == 'con_deuda' %}selected{% endif %}>Con deuda</option>
                    <option value="al_dia" {% if f_deuda == 'al_dia' %}selected{% endif %}>Al día</option>
                </select>
            </div>
        </form>
    </div>

    <!-- TABLA DE RESULTADOS -->
    <div id="tabla-resultados">
        {% include 'clientes/_tabla_clientes.html' %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const formFiltros = document.getElementById('formFiltrosClientes');
    const contenedor = document.getElementById('tabla-resultados');

    if (!formFiltros || !contenedor) return;

    function renderFila(c) {
        const link = `<a href="/clientes/${c.id}/" class="text-dark fw-bold text-decoration-none">${ERP.format.escapeHtml(c.nombre)}</a>`;
        const saldo = ERP.format.money(c.saldo_pendiente);
        const estado = c.saldo_pendiente > 0 ? `<span class="text-danger fw-bold">${saldo}</span>` : `<span class="badge bg-success">Al día</span>`;
        return `<tr><td>${link}<div class="d-sm-none small text-muted mt-1"><i class="bi bi-telephone"></i> ${ERP.format.escapeHtml(c.telefono)}</div></td><td class="d-none d-md-table-cell">${ERP.format.escapeHtml(c.email || '—')}</td><td class="d-none d-sm-table-cell"><span class="badge bg-secondary rounded-pill">${ERP.format.integer(c.pedidos)}</span></td><td>${estado}</td><td class="text-end"><a href="/clientes/${c.id}/" class="btn btn-sm btn-outline-primary" title="Ver Perfil"><i class="bi bi-person-lines-fill"></i></a></td></tr>`;
    }

    async function actualizarTabla() {
        contenedor.style.opacity = '0.5';
        const params = Object.fromEntries(new FormData(formFiltros).entries());
        try {
            const resultado = await ERP.api.getAll('{% url "clientes_api:lista" %}', params);
            const tbody = document.querySelector('#tabla-clientes tbody');
            if (tbody) {
                ERP.dataTables.destruir('#tabla-clientes');
                tbody.innerHTML = resultado.data.map(renderFila).join('');
            }
            const total = document.getElementById('total-clientes');
            if (total) {
                total.textContent = resultado.data.length;
            }
            ERP.dataTables.reiniciar('#tabla-clientes');
        } catch (err) {
            console.error(err);
        } finally {
            contenedor.style.opacity = '1';
        }
    }

    let timer;
    formFiltros.querySelectorAll('input[type="text"], select').forEach(el => {
        el.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(actualizarTabla, 400);
        });
        el.addEventListener('change', () => {
            clearTimeout(timer);
            timer = setTimeout(actualizarTabla, 100);
        });
    });
});
</script>
{% endblock %}
