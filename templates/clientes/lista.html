{% extends 'base.html' %}

{% block title %}Directorio de Clientes - Vargas Editorial{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-0 fw-bold"><i class="bi bi-people text-primary"></i> Directorio de Clientes</h2>
        <p class="text-muted mb-0">Total de clientes registrados: {{ total_clientes }}</p>
    </div>
</div>

<!-- FILTROS Y TABLA -->
<div class="card card-kpi" id="contenedor-tabla-clientes">
    
    <!-- BARRA DE FILTROS -->
    <div class="p-3 border-bottom">
        <form id="formFiltrosClientes" class="row g-2 align-items-end">
            <!-- Input oculto para guardar el orden actual -->
            <input type="hidden" name="orden" id="inputOrden" value="{{ orden_actual }}">
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Nombre</label>
                <input type="text" name="nombre" class="form-control form-control-sm" placeholder="Buscar nombre..." value="{{ f_nombre }}">
            </div>
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Teléfono</label>
                <input type="text" name="telefono" class="form-control form-control-sm" placeholder="Buscar teléfono..." value="{{ f_telefono }}">
            </div>
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Email</label>
                <input type="text" name="email" class="form-control form-control-sm" placeholder="Buscar email..." value="{{ f_email }}">
            </div>
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Estado de deuda</label>
                <select name="deuda" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option value="con_deuda" {% if f_deuda == 'con_deuda' %}selected{% endif %}>Con deuda</option>
                    <option value="al_dia" {% if f_deuda == 'al_dia' %}selected{% endif %}>Al día</option>
                </select>
            </div>
        </form>
    </div>

    <!-- TABLA DE RESULTADOS -->
    <div id="tabla-resultados">
        {% include 'clientes/_tabla_clientes.html' %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const formFiltros = document.getElementById('formFiltrosClientes');
    const contenedor = document.getElementById('tabla-resultados');
    
    if (formFiltros && contenedor) {
        function renderVacio() {
            return '<div class="table-responsive"><table class="table table-hover mb-0 align-middle"><tbody><tr><td colspan="5" class="text-center text-muted py-5"><i class="bi bi-people fs-1 d-block mb-2"></i>No se encontraron clientes.</td></tr></tbody></table></div>';
        }

        function renderFila(c) {
            const link = `<a href="/clientes/${c.id}/" class="text-dark fw-bold text-decoration-none">${ERP.format.escapeHtml(c.nombre)}</a>`;
            const saldo = ERP.format.money(c.saldo_pendiente);
            const estado = c.saldo_pendiente > 0 ? `<span class="text-danger fw-bold">${saldo}</span>` : `<span class="badge bg-success">Al día</span>`;
            return `<tr><td>${link}<div class="d-sm-none small text-muted mt-1"><i class="bi bi-telephone"></i> ${ERP.format.escapeHtml(c.telefono)}</div></td><td class="d-none d-md-table-cell">${ERP.format.escapeHtml(c.email || '—')}</td><td class="d-none d-sm-table-cell"><span class="badge bg-secondary rounded-pill">${ERP.format.integer(c.pedidos)}</span></td><td>${estado}</td><td class="text-end"><a href="/clientes/${c.id}/" class="btn btn-sm btn-outline-primary" title="Ver Perfil"><i class="bi bi-person-lines-fill"></i></a></td></tr>`;
        }

        function renderTabla(clientes, pagination) {
            const filas = clientes.map(renderFila).join('');
            const start = pagination.start_index || 0;
            const end = pagination.end_index || 0;
            const total = pagination.total || 0;
            const options = pagination.per_page_options || [10, 25, 50];
            const selects = options.map(n => `<option value="${n}"${n === pagination.per_page ? ' selected' : ''}>${n}</option>`).join('');
            const paginacion = pagination.num_pages > 1 ? `<div id="paginacion-ajax-clientes"></div>` : '';
            contenedor.innerHTML = `<div class="table-responsive"><table class="table table-hover mb-0 align-middle"><thead class="table-light"><tr><th style="cursor: pointer;" class="sortable" data-orden="nombre">Nombre</th><th class="d-none d-md-table-cell">Email</th><th class="d-none d-sm-table-cell" style="cursor: pointer;" class="sortable" data-orden="pedidos">Pedidos</th><th>Saldo Pendiente</th><th class="text-end">Acciones</th></tr></thead><tbody>${filas || '<tr><td colspan="5" class="text-center text-muted py-5"><i class="bi bi-people fs-1 d-block mb-2"></i>No se encontraron clientes.</td></tr>'}</tbody></table></div>${paginacion}`;
            const paginacionEl = document.getElementById('paginacion-ajax-clientes');
            if (paginacionEl) {
                ERP.pagination.render(paginacionEl, pagination, (page, perPage) => actualizarTabla(page, perPage));
            }
        }

        function actualizarTabla(page = null, perPage = null) {
            contenedor.style.opacity = '0.5';
            const formData = new FormData(formFiltros);
            if (page) formData.set('page', page);
            if (perPage) formData.set('per_page', perPage);
            const params = new URLSearchParams(formData).toString();
            fetch(`{% url 'clientes_api:lista' %}?${params}`, {
                credentials: 'same-origin'
            })
            .then(response => response.json())
            .then(data => {
                contenedor.innerHTML = data.data.clientes.length ? renderTabla(data.data.clientes, data.pagination) : renderVacio();
                contenedor.style.opacity = '1';
            })
            .catch(err => {
                console.error(err);
                contenedor.style.opacity = '1';
            });
        }

        let timer;
        formFiltros.querySelectorAll('input[type="text"], select').forEach(el => {
            el.addEventListener('input', () => {
                clearTimeout(timer);
                timer = setTimeout(actualizarTabla, 400);
            });
        });

        document.addEventListener('click', function(e) {
            const th = e.target.closest('th.sortable');
            if (!th) return;
            const columna = th.getAttribute('data-orden');
            const inputOrden = document.getElementById('inputOrden');
            let nuevoOrden = '';
            if (columna === 'nombre') {
                nuevoOrden = (inputOrden.value === 'nombre_asc') ? 'nombre_desc' : 'nombre_asc';
            } else if (columna === 'pedidos') {
                nuevoOrden = (inputOrden.value === 'pedidos_desc') ? 'pedidos_asc' : 'pedidos_desc';
            }
            if (nuevoOrden) {
                inputOrden.value = nuevoOrden;
                actualizarTabla();
            }
        });

        actualizarTabla();
    }
});
</script>
{% endblock %}
