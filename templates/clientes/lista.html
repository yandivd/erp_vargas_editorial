{% extends 'base.html' %}

{% block title %}Directorio de Clientes - Vargas Editorial{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-0 fw-bold"><i class="bi bi-people text-primary"></i> Directorio de Clientes</h2>
        <p class="text-muted mb-0">Total de clientes registrados: {{ total_clientes }}</p>
    </div>
</div>

<!-- FILTROS Y TABLA -->
<div class="card card-kpi" id="contenedor-tabla-clientes">
    
    <!-- BARRA DE FILTROS -->
    <div class="p-3 border-bottom">
        <form id="formFiltrosClientes" class="row g-2 align-items-end">
            <!-- Input oculto para guardar el orden actual -->
            <input type="hidden" name="orden" id="inputOrden" value="{{ orden_actual }}">
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Nombre</label>
                <input type="text" name="nombre" class="form-control form-control-sm" placeholder="Buscar nombre..." value="{{ f_nombre }}">
            </div>
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Teléfono</label>
                <input type="text" name="telefono" class="form-control form-control-sm" placeholder="Buscar teléfono..." value="{{ f_telefono }}">
            </div>
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Email</label>
                <input type="text" name="email" class="form-control form-control-sm" placeholder="Buscar email..." value="{{ f_email }}">
            </div>
            
            <div class="col-12 col-sm-6 col-md-3">
                <label class="form-label small fw-bold text-muted mb-1">Estado de deuda</label>
                <select name="deuda" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option value="con_deuda" {% if f_deuda == 'con_deuda' %}selected{% endif %}>Con deuda</option>
                    <option value="al_dia" {% if f_deuda == 'al_dia' %}selected{% endif %}>Al día</option>
                </select>
            </div>
        </form>
    </div>

    <!-- TABLA DE RESULTADOS -->
    <div id="tabla-resultados">
        {% include 'clientes/_tabla_clientes.html' %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const formFiltros = document.getElementById('formFiltrosClientes');
    const contenedor = document.getElementById('tabla-resultados');
    
    if (formFiltros && contenedor) {
        // Función para actualizar la tabla
        function actualizarTabla() {
            contenedor.style.opacity = '0.5';
            const formData = new FormData(formFiltros);
            const params = new URLSearchParams(formData).toString();
            
            fetch(`?${params}`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(response => response.json())
            .then(data => {
                contenedor.innerHTML = data.html;
                contenedor.style.opacity = '1';
                engancharPaginacion();
            })
            .catch(err => {
                console.error(err);
                contenedor.style.opacity = '1';
            });
        }

        // Función para la paginación
        function engancharPaginacion() {
            const paginacion = document.getElementById('paginacion-ajax-clientes');
            if (!paginacion) return;
            
            paginacion.querySelectorAll('a.page-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.getAttribute('data-page');
                    if (!page) return;
                    
                    const formData = new FormData(formFiltros);
                    formData.set('page', page);
                    const params = new URLSearchParams(formData).toString();
                    
                    contenedor.style.opacity = '0.5';
                    fetch(`?${params}`, {
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    })
                    .then(r => r.json())
                    .then(data => {
                        contenedor.innerHTML = data.html;
                        contenedor.style.opacity = '1';
                        engancharPaginacion();
                    });
                });
            });
        }


        // Escuchar cambios en los inputs de filtro
        let timer;
        formFiltros.querySelectorAll('input[type="text"], select').forEach(el => {
            el.addEventListener('input', () => {
                clearTimeout(timer);
                timer = setTimeout(actualizarTabla, 400);
            });
        });

        // Escuchar clics en las columnas para ordenar
        document.addEventListener('click', function(e) {
            const th = e.target.closest('th.sortable');
            if (!th) return;

            const columna = th.getAttribute('data-orden');
            const inputOrden = document.getElementById('inputOrden');
            let nuevoOrden = '';

            if (columna === 'nombre') {
                nuevoOrden = (inputOrden.value === 'nombre_asc') ? 'nombre_desc' : 'nombre_asc';
            } else if (columna === 'pedidos') {
                nuevoOrden = (inputOrden.value === 'pedidos_desc') ? 'pedidos_asc' : 'pedidos_desc';
            }

            if (nuevoOrden) {
                inputOrden.value = nuevoOrden;
                actualizarTabla(); // Recargamos la tabla con el nuevo orden
            }
        });

        // Conectar la paginación inicial
        engancharPaginacion();
    }
});
</script>
{% endblock %}
