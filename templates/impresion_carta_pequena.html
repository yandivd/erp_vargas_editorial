{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        /* Ancho 100% del contenedor */
        @page {
            size: 58mm auto;
            margin: 0; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* El body ahora ocupa TODO el ancho de la pantalla, sin márgenes ni fondos */
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14pt; /* Letra grande */
            color: #000;
            background: #ffffff; 
            margin: 0 !important; 
            padding: 0 !important;
            width: 100% !important; /* Ocupa toda la pantalla */
        }

        .hoja {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        /* El ticket ocupa el 100% */
        .etiqueta { 
            width: 100%;      
            background: #ffffff;
            padding: 2mm; /* Un pequeño margen para que no toque el borde físico */
            margin: 0; 
            display: flex;
            flex-direction: column;
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 1.5mm;
            margin-bottom: 2mm;
        }

        .etq-empresa {
            font-size: 16pt;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.1;
        }

        .etq-sub {
            font-size: 12pt; 
            margin: 1mm 0 0 0;
            line-height: 1.1;
        }

        /* Cuerpo */
        .etq-cuerpo {
            font-size: 14pt; 
            line-height: 1.2;
        }

        .etq-cuerpo p {
            margin: 0 0 1.5mm 0;
            display: flex;
            justify-content: space-between;
        }

        .etq-label {
            font-weight: bold;
        }

        /* Tabla mini */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 13pt; 
            margin: 1.5mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 1px solid #000;
            border-top: 1px solid #000;
            padding: 1mm 0;
        }

        .etq-tabla td {
            padding: 1mm 0;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            font-size: 14pt;
            border-top: 1px dashed #000;
            padding-top: 1.5mm;
            margin-top: 1.5mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 1mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: bold;
            font-size: 16pt; 
            border-top: 1px solid #000;
            padding-top: 1.5mm;
            margin-top: 1.5mm;
        }
    </style>
</head>
<body>

    <!-- Ya NO hay botones en el HTML. Usa el botón de la app. -->

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
