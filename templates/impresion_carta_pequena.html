{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        @page {
            size: 58mm auto;
            margin: 0; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace; 
            font-weight: bold;
            text-transform: uppercase; 
            font-size: 22px; /* Tamaño uniforme */
            color: #000;
            background: #ffffff; 
            margin: 0 !important; 
            padding: 0 !important;
            width: 100% !important; 
        }

        .hoja {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .etiqueta { 
            width: 100%;      
            background: #ffffff;
            padding: 1mm; 
            margin: 0; 
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 3px dashed #000;
            padding-bottom: 2mm;
            margin-bottom: 2mm;
        }

        .etq-empresa, .etq-sub {
            font-size: 22px; 
            margin: 0;
        }

        /* Cuerpo */
        .etq-cuerpo {
            font-size: 22px; 
            line-height: 1.2;
        }

        .etq-cuerpo p {
            margin: 0 0 2px 0;
        }

        /* Tabla */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 22px; 
            margin: 2mm 0;
            table-layout: fixed; /* ESTO ES CLAVE: Fija el ancho de las columnas */
        }

        .etq-tabla th, .etq-tabla td {
            padding: 1mm 0;
            font-size: 22px; 
            vertical-align: top;
            /* Permitir que el texto salte de línea */
            word-wrap: break-word; 
            white-space: normal; 
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 2px solid #000;
            border-top: 2px solid #000;
        }

        /* Definimos los anchos de las columnas */
        .etq-tabla .col-libro { width: 60%; } /* El libro ocupa la mayor parte y salta de línea */
        .etq-tabla .col-cant { width: 15%; text-align: center; }
        .etq-tabla .col-saldo { width: 25%; text-align: right; }

        /* Totales */
        .etq-totales {
            font-size: 22px;
            border-top: 3px dashed #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }

        .etq-totales .fila {
            margin: 1mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: bold;
            font-size: 22px; 
            border-top: 2px solid #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }
    </style>
</head>
<body>

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
