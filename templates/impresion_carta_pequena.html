{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        /* Forzamos el tamaño exacto del papel */
        @page {
            size: 58mm auto;
            margin: 0; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* Eliminamos fondos y forzamos el ancho a 58mm */
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14pt; /* Letra base mucho más grande */
            color: #000;
            background: #ffffff; /* Fondo blanco puro, sin grises */
            margin: 0 auto !important; 
            padding: 0 !important;
            width: 58mm !important; /* Ancho exacto de la impresora */
            max-width: 58mm !important;
        }

        /* El contenedor ya no centra, solo envuelve */
        .hoja {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        /* La etiqueta ocupa el 100% del body */
        .etiqueta { 
            width: 100%;      
            background: #ffffff;
            padding: 1mm; /* Margen mínimo interno para que no toque el borde */
            margin: 0; 
            display: flex;
            flex-direction: column;
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 1mm;
            margin-bottom: 1.5mm;
        }

        .etq-empresa {
            font-size: 16pt; /* Empresa bien grande */
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.1;
        }

        .etq-sub {
            font-size: 11pt; 
            margin: 1mm 0 0 0;
            line-height: 1.1;
        }

        /* Cuerpo */
        .etq-cuerpo {
            font-size: 14pt; /* Letra grande y clara */
            line-height: 1.2;
        }

        .etq-cuerpo p {
            margin: 0 0 1mm 0;
            display: flex;
            justify-content: space-between;
        }

        .etq-label {
            font-weight: bold;
        }

        /* Tabla mini */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 13pt; 
            margin: 1.5mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 1px solid #000;
            border-top: 1px solid #000;
            padding: 1mm 0;
        }

        .etq-tabla td {
            padding: 1mm 0;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            font-size: 14pt;
            border-top: 1px dashed #000;
            padding-top: 1.5mm;
            margin-top: 1.5mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 1mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: bold;
            font-size: 16pt; /* TOTAL bien grande */
            border-top: 1px solid #000;
            padding-top: 1.5mm;
            margin-top: 1.5mm;
        }

        /* Botones (Invisibles al imprimir) */
        .no-print {
            text-align: center;
            margin: 20px 0;
        }
        @media print {
            .no-print { display: none !important; }
            /* Aseguramos que en impresión no haya márgenes */
            body { margin: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body>

    <!-- Botones -->
    <div class="no-print">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px;">🖨 Imprimir</button>
        <button onclick="window.close()" style="padding: 10px 20px; font-size: 16px;">✕ Cerrar</button>
    </div>

    <!-- Contenido -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
