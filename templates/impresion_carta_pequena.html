{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        /* Configuración para impresión térmica (80mm) o Carta */
        @page {
            margin: 0; /* Quitamos márgenes para aprovechar todo el ancho */
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Fuente tipo ticket */
            font-size: 10pt;
            color: #000;
            margin: 0;
            padding: 0;
            background: #f4f6f9;
        }

        /* Contenedor principal para pantalla */
        .hoja {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px;
        }

        /* La etiqueta/ticket ocupa el 100% del ancho */
        .etiqueta { 
            width: 100%;
            max-width: 80mm; /* Ancho estándar de impresora térmica. Si es Carta, quita esto */
            background: white;
            padding: 5mm;
            border: 1px dashed #ccc;
            margin-bottom: 5mm; /* Separación entre tickets si hay varios */
            page-break-inside: avoid;
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 3mm;
            margin-bottom: 3mm;
        }

        .etq-logo {
            max-height: 15mm;
            max-width: 30mm;
            margin-bottom: 2mm;
        }

        .etq-empresa {
            font-size: 12pt;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
        }

        .etq-sub {
            font-size: 8pt;
            margin: 1mm 0 0 0;
        }

        /* Cuerpo */
        .etq-cuerpo {
            font-size: 9pt;
            line-height: 1.3;
            margin-bottom: 3mm;
        }

        .etq-cuerpo p {
            margin: 0 0 1mm 0;
            display: flex;
            justify-content: space-between;
        }

        .etq-label {
            font-weight: bold;
        }

        .etq-titulo-libro {
            font-size: 10pt;
            font-weight: bold;
            margin: 2mm 0;
            text-align: center;
        }

        /* Tabla mini */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 8pt;
            margin: 2mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 1px solid #000;
            border-top: 1px solid #000;
            padding: 1mm 0;
        }

        .etq-tabla td {
            padding: 1mm 0;
            vertical-align: top;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            font-size: 9pt;
            border-top: 1px dashed #000;
            padding-top: 3mm;
            margin-top: 3mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 1mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: bold;
            font-size: 12pt;
            border-top: 1px solid #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }

        /* Impresión */
        @media print {
            body { background: white; }
            .hoja { padding: 0; display: block; }
            
            /* Si usas hoja Carta en vez de impresora térmica, descomenta esto: */
            /* .etiqueta { max-width: 100%; border: none; padding: 0; } */

            .etiqueta { 
                border: none; /* Quitamos el borde punteado al imprimir */
                margin: 0; 
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- Botones (no se imprimen) -->
    <div class="no-print" style="text-align:center; margin: 5mm 0;">
        <button onclick="window.print()" style="padding: 2mm 5mm; cursor:pointer; font-size: 14px;">🖨 Imprimir</button>
        <button onclick="window.close()" style="padding: 2mm 5mm; cursor:pointer; font-size: 14px;">✕ Cerrar</button>
    </div>

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
