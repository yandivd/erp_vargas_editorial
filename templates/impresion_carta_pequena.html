{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        body, div, p, span, table, th, td {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold;
            text-transform: uppercase;
            color: #000;
            background: #ffffff; 
            width: 100%;
        }

        .etiqueta { 
            width: 100%;      
            background: #ffffff;
            padding: 2mm; 
            display: flex;
            flex-direction: column;
            font-size: 24px; 
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 3px dashed #000;
            padding-bottom: 2mm;
            margin-bottom: 2mm;
        }

        .etq-logo {
            height: 120px !important; 
            width: auto !important; 
            max-width: none !important; 
            margin-bottom: 10px;
            display: inline-block;
        }

        .etq-empresa {
            font-size: 32px !important; 
            font-weight: 900;
        }

        .etq-sub {
            font-size: 22px !important;
        }

        /* Cuerpo */
        .etq-cuerpo p {
            font-size: 24px !important;
            margin-bottom: 4px;
            display: block; 
        }

        /* Tabla */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            margin: 3mm 0;
        }

        .etq-tabla th {
            font-size: 24px !important;
            text-align: left;
            border-bottom: 3px solid #000;
            border-top: 3px solid #000;
            padding: 1.5mm 0;
        }

        .etq-tabla td {
            font-size: 24px !important;
            padding: 1.5mm 0;
            vertical-align: top;
            /* ESTO HACE QUE EL TEXTO BAJE DE LÍNEA SI ES MUY LARGO */
            word-wrap: break-word; 
            word-break: break-word;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            border-top: 3px dashed #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }

        .etq-totales .fila span {
            font-size: 24px !important;
            display: inline-block;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 2mm 0;
        }

        .etq-totales .fila.total-final span {
            font-size: 32px !important; 
            font-weight: 900;
        }

        .etq-totales .fila.total-final {
            border-top: 3px solid #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }
    </style>
</head>
<body>

    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
