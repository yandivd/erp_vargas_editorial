{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        /* Configuración para impresora de rollo en Chrome Android */
        @page {
            size: 58mm auto;
            margin: 0; /* Vital para que no haya bordes blancos */
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12pt; /* Fuente base más grande */
            color: #000;
            margin: 0;
            padding: 0;
            background: #f4f6f9;
            width: 100%;
        }

        /* Contenedor para pantalla */
        .hoja {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px;
        }

        /* La etiqueta/ticket */
        .etiqueta { 
            width: 100%;      
            max-width: 58mm;  
            background: white;
            padding: 1mm; /* Mínimo margen interno */
            border: 1px dashed #ccc;
            margin-bottom: 5mm; 
            page-break-inside: avoid;
            display: flex;
            flex-direction: column;
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 1.5mm;
            margin-bottom: 2mm;
        }

        .etq-empresa {
            font-size: 15pt; /* Empresa bien grande */
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.1;
        }

        .etq-sub {
            font-size: 10pt; 
            margin: 1mm 0 0 0;
            line-height: 1.1;
        }

        /* Cuerpo */
        .etq-cuerpo {
            font-size: 12pt; /* Datos del cliente grandes */
            line-height: 1.3;
        }

        .etq-cuerpo p {
            margin: 0 0 1.5mm 0;
            display: flex;
            justify-content: space-between;
        }

        .etq-label {
            font-weight: bold;
        }

        /* Tabla mini */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 11pt; 
            margin: 1.5mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 1px solid #000;
            border-top: 1px solid #000;
            padding: 1mm 0;
        }

        .etq-tabla td {
            padding: 1mm 0;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            font-size: 12pt;
            border-top: 1px dashed #000;
            padding-top: 1.5mm;
            margin-top: 2mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 1mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: bold;
            font-size: 14pt; /* TOTAL bien destacado */
            border-top: 1px solid #000;
            padding-top: 1.5mm;
            margin-top: 1.5mm;
        }

        /* =========================================
           REGLAS DE IMPRESIÓN (CHROME ANDROID)
           ========================================= */
        @media print {
            body { 
                background: white; 
                width: 100%;
                margin: 0;
                padding: 0;
            }
            
            /* Ocultar botones de forma estricta */
            .no-print { 
                display: none !important; 
            }
            
            .hoja { 
                padding: 0; 
                display: block; 
                width: 100%;
            }
            
            .etiqueta { 
                border: none; 
                margin: 0; 
                /* Forzamos el 100% del ancho imprimible */
                width: 100%; 
                max-width: 100%; 
                padding: 0.5mm; 
            }
        }
    </style>
</head>
<body>

    <!-- Botones (Ocultos al imprimir) -->
    {% comment %} <div class="no-print" style="text-align:center; margin: 20px 0;">
        <button onclick="window.print()" style="padding: 10px 20px; cursor:pointer; font-size: 16px; background-color: #000; color: white; border: none; border-radius: 5px;">🖨 Imprimir</button>
        <button onclick="window.close()" style="padding: 10px 20px; cursor:pointer; font-size: 16px; background-color: #eee; border: 1px solid #ccc; border-radius: 5px; margin-left: 10px;">✕ Cerrar</button>
    </div> {% endcomment %}

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
