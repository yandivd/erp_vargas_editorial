{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        @page {
            size: 58mm auto;
            margin: 0; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* Fuente monoespaciada tipo ticket, negrita y letra grande */
        body {
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold;
            text-transform: uppercase; /* Todo en mayúsculas */
            font-size: 18px; /* Letra base GIGANTE */
            color: #000;
            background: #ffffff; 
            margin: 0 !important; 
            padding: 0 !important;
            width: 100% !important; 
        }

        .hoja {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .etiqueta { 
            width: 100%;      
            background: #ffffff;
            padding: 1mm; 
            margin: 0; 
            display: flex;
            flex-direction: column;
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 2px dashed #000;
            padding-bottom: 2mm;
            margin-bottom: 2mm;
        }

        .etq-empresa {
            font-size: 24px; /* Enorme */
            font-weight: 900;
            margin: 0;
            line-height: 1;
        }

        .etq-sub {
            font-size: 16px; 
            margin: 2px 0 0 0;
            line-height: 1;
        }

        /* Cuerpo */
        .etq-cuerpo {
            font-size: 18px; 
            line-height: 1.2;
        }

        .etq-cuerpo p {
            margin: 0 0 2px 0;
            display: flex;
            justify-content: space-between;
        }

        /* Tabla mini */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px; 
            margin: 2mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 2px solid #000;
            border-top: 2px solid #000;
            padding: 1mm 0;
            font-size: 16px;
        }

        .etq-tabla td {
            padding: 1mm 0;
            vertical-align: top;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            font-size: 18px;
            border-top: 2px dashed #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 1mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: 900;
            font-size: 24px; /* El total gigante */
            border-top: 2px solid #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }
    </style>
</head>
<body>

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
