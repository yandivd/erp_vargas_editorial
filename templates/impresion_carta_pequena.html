{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        /* Configuración para impresora de rollo */
        @page {
            size: 58mm auto; /* Ancho fijo, largo automático */
            margin: 0;       /* Cero márgenes para que no haya bordes blancos */
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 9.5pt;
            color: #000;
            margin: 0;
            padding: 0;
            background: #f4f6f9;
        }

        /* Contenedor para pantalla */
        .hoja {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px;
        }

        /* La etiqueta/ticket: Ancho exacto, largo dinámico */
        .etiqueta { 
            width: 58mm;  
            /* Quitamos el height fijo, ahora crece lo que necesite */
            background: white;
            padding: 2mm;
            border: 1px dashed #ccc;
            margin-bottom: 5mm; 
            page-break-inside: avoid;
            display: flex;
            flex-direction: column;
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 1.5mm;
            margin-bottom: 2mm;
            flex-shrink: 0;
        }

        .etq-logo {
            max-height: 8mm;
            max-width: 20mm;
            margin-bottom: 1mm;
        }

        .etq-empresa {
            font-size: 11pt;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
        }

        .etq-sub {
            font-size: 7.5pt;
            margin: 1mm 0 0 0;
            line-height: 1;
        }

        /* Cuerpo */
        .etq-cuerpo {
            font-size: 9.5pt;
            line-height: 1.3;
        }

        .etq-cuerpo p {
            margin: 0 0 1mm 0;
            display: flex;
            justify-content: space-between;
        }

        .etq-label {
            font-weight: bold;
        }

        /* Tabla mini */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 8.5pt;
            margin: 1mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 1px solid #000;
            border-top: 1px solid #000;
            padding: 1mm 0;
        }

        .etq-tabla td {
            padding: 1mm 0;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            font-size: 9.5pt;
            border-top: 1px dashed #000;
            padding-top: 1.5mm;
            margin-top: 2mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 0.5mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: bold;
            font-size: 11pt;
            border-top: 1px solid #000;
            padding-top: 1mm;
            margin-top: 1mm;
        }

        /* =========================================
           REGLAS DE IMPRESIÓN PARA OCULTAR BOTONES
           ========================================= */
        @media print {
            body { background: white; }
            
            /* Ocultar botones de forma agresiva */
            .no-print { 
                display: none !important; 
            }
            
            .hoja { 
                padding: 0; 
                display: block; 
            }
            
            .etiqueta { 
                border: none; /* Quitamos el borde punteado en el papel */
                margin: 0; 
                padding: 0; /* El margen lo da la propia impresora */
            }

            /* Ocultar encabezados y pies de página del navegador */
            @page { margin: 0; }
        }
    </style>
</head>
<body>

    <!-- Botones -->
    {% comment %} <div class="no-print" style="text-align:center; margin: 20px 0;">
        <button onclick="window.print()" style="padding: 10px 20px; cursor:pointer; font-size: 16px; background-color: #333; color: white; border: none; border-radius: 5px;">🖨 Imprimir</button>
        <button onclick="window.close()" style="padding: 10px 20px; cursor:pointer; font-size: 16px; background-color: #ccc; border: none; border-radius: 5px; margin-left: 10px;">✕ Cerrar</button>
    </div> {% endcomment %}

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
