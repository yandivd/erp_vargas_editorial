{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Documento{% endblock %}</title>
    <style>
        /* Hoja Carta - Márgenes al mínimo para aprovechar todo el ancho */
        @page {
            size: Letter;
            margin: 2mm; /* Reducido al mínimo para aprovechar el 100% */
        }

        * { 
            box-sizing: border-box; 
            /* Forzar la impresión de fondos (colores) */
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 7pt;
            color: #000;
            margin: 0;
            padding: 0;
            background: #f4f6f9;
        }

        /* Contenedor que ocupa el 100% del ancho */
        .hoja {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            /* Espaciado uniforme entre filas */
            row-gap: 2mm;
        }

        /* Cada comprobante: Ahora usa 50% del ancho, menos un pequeño margen */
        .etiqueta { 
            width: 50%;
            padding: 2mm; /* Espacio interno de la etiqueta */
            min-height: 80mm;
            overflow: hidden;
            page-break-inside: avoid;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: white;
            border: 0.2mm dashed #999; /* Borde para guiar el corte */
        }

        /* Cabecera */
        .etq-header {
            display: flex;
            align-items: center;
            gap: 1mm;
            border-bottom: 0.3mm solid #000;
            padding-bottom: 1mm;
        }

        .etq-logo {
            max-height: 6mm;
            max-width: 8mm;
            object-fit: contain;
        }

        .etq-empresa {
            font-size: 5.5pt;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1;
            margin: 0;
        }

        .etq-sub {
            font-size: 4.5pt;
            color: #555;
            margin: 0;
            line-height: 1;
        }

        /* Cuerpo */
        .etq-cuerpo {
            flex: 1;
            padding: 1.5mm 0;
            font-size: 6pt;
            line-height: 1.2;
            overflow: hidden;
        }

        .etq-cuerpo p {
            margin: 0 0 0.8mm 0;
        }

        .etq-label {
            font-size: 4.5pt;
            text-transform: uppercase;
            color: #777;
            letter-spacing: 0.1mm;
        }

        .etq-valor {
            font-weight: bold;
            font-size: 6.5pt;
        }

        .etq-titulo-libro {
            font-size: 6.5pt;
            font-weight: bold;
            line-height: 1.1;
            margin: 0.5mm 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Pie */
        .etq-footer {
            border-top: 0.3mm solid #000;
            padding-top: 1mm;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .etq-ref {
            font-size: 9pt;
            font-weight: bold;
            line-height: 1;
        }

        .etq-ref-label {
            font-size: 4.5pt;
            text-transform: uppercase;
            color: #777;
            display: block;
        }

        .etq-estado {
            font-size: 5pt;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0.5mm 1.5mm;
            border-radius: 0.8mm;
            background: #000;
            color: #fff;
        }

        .etq-saldo {
            font-size: 6.5pt;
            font-weight: bold;
            color: #c0392b;
        }

        /* Tabla mini (para consolidado) */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 5pt;
            margin: 1mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 0.2mm solid #000;
            padding: 0.5mm 0;
            font-size: 4.5pt;
            text-transform: uppercase;
        }

        .etq-tabla td {
            padding: 0.5mm 0;
            vertical-align: top;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales mini */
        .etq-totales {
            font-size: 5.5pt;
            border-top: 0.2mm solid #000;
            padding-top: 1mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 0.3mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: bold;
            font-size: 6.5pt;
            border-top: 0.2mm solid #000;
            padding-top: 1mm;
            margin-top: 1mm;
        }

        /* Impresión */
        @media print {
            body { background: white; }
            .etiqueta { border: 0.2mm dashed #ccc; }
            .no-print { display: none !important; }
            
            /* Forzar que la hoja no tenga márgenes extras en algunos navegadores */
            html, body {
                width: 100%;
                margin: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Botones (no se imprimen) -->
    <div class="no-print" style="text-align:center; margin:5mm 0;">
        <button onclick="window.print()" style="padding:2mm 5mm; cursor:pointer;">🖨 Imprimir</button>
        <button onclick="window.close()" style="padding:2mm 5mm; cursor:pointer;">✕ Cerrar</button>
    </div>

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
