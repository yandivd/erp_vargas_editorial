{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        /* Dimensiones exactas de la etiqueta */
        @page {
            size: 58mm 61mm;
            margin: 0;
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: Arial, Helvetica, sans-serif; /* Arial se lee más grande que Courier */
            font-size: 9pt; /* Aumentado de tamaño */
            color: #000;
            margin: 0;
            padding: 0;
            background: #f4f6f9;
        }

        /* Contenedor para pantalla */
        .hoja {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px;
        }

        /* La etiqueta/ticket */
        .etiqueta { 
            width: 58mm;  /* Ancho exacto */
            height: 61mm; /* Alto exacto */
            background: white;
            padding: 2mm;
            border: 1px dashed #ccc;
            margin-bottom: 5mm; 
            page-break-inside: avoid;
            display: flex;
            flex-direction: column;
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 1mm;
            margin-bottom: 2mm;
            flex-shrink: 0;
        }

        .etq-logo {
            max-height: 8mm;
            max-width: 20mm;
            margin-bottom: 1mm;
        }

        .etq-empresa {
            font-size: 11pt; /* Más grande */
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
        }

        .etq-sub {
            font-size: 7.5pt;
            margin: 1mm 0 0 0;
            line-height: 1;
        }

        /* Cuerpo */
        .etq-cuerpo {
            font-size: 9.5pt;
            line-height: 1.2;
            flex-grow: 1; /* Ocupa el espacio central */
        }

        .etq-cuerpo p {
            margin: 0 0 1mm 0;
            display: flex;
            justify-content: space-between;
        }

        .etq-label {
            font-weight: bold;
        }

        /* Tabla mini */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 8.5pt;
            margin: 1mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 1px solid #000;
            border-top: 1px solid #000;
            padding: 0.5mm 0;
        }

        .etq-tabla td {
            padding: 0.5mm 0;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            font-size: 9.5pt;
            border-top: 1px dashed #000;
            padding-top: 1.5mm;
            margin-top: auto; /* Empuja los totales al fondo */
            flex-shrink: 0;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 0.5mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: bold;
            font-size: 11pt;
            border-top: 1px solid #000;
            padding-top: 1mm;
            margin-top: 1mm;
        }

        /* =========================================
           REGLAS DE IMPRESIÓN
           ========================================= */
        @media print {
            body { background: white; }
            .hoja { padding: 0; display: block; }
            
            /* Ocultar botones y cualquier cosa que no sea la etiqueta */
            .no-print { 
                display: none !important; 
                visibility: hidden !important;
                height: 0 !important;
                width: 0 !important;
                opacity: 0 !important;
            }
            
            .etiqueta { 
                border: none; /* Quitamos el borde punteado en el papel */
                margin: 0; 
            }
        }
    </style>
</head>
<body>

    <!-- Botones (Ocultos estrictamente en impresión) -->
    <div class="no-print" style="text-align:center; margin: 10px 0;">
        <button onclick="window.print()" style="padding: 8px 15px; cursor:pointer; font-size: 14px;">🖨 Imprimir</button>
        <button onclick="window.close()" style="padding: 8px 15px; cursor:pointer; font-size: 14px;">✕ Cerrar</button>
    </div>

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
