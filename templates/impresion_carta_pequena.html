{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        @page {
            size: 58mm auto;
            margin: 0; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* FUENTE BASE GIGANTE */
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: #000;
            background: #ffffff; 
            margin: 0 !important; 
            padding: 0 !important;
            width: 100% !important; 
            font-size: 32px; /* ENORME */
        }

        .hoja {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .etiqueta { 
            width: 100%;      
            background: #ffffff;
            padding: 2mm 1mm; 
            margin: 0; 
            display: flex;
            flex-direction: column;
        }

        /* --- CABECERA --- */
        .etq-header {
            text-align: center;
            border-bottom: 4px dashed #000;
            padding-bottom: 2mm;
            margin-bottom: 2mm;
        }

        .etq-logo {
            height: 120px; /* Logo gigante */
            width: auto;
            max-width: 100%;
            margin-bottom: 5px;
            display: inline-block;
        }

        .etq-empresa {
            font-size: 45px; /* Empresa GIGANTE */
            font-weight: 900;
            margin: 0;
            line-height: 1;
        }

        .etq-sub {
            font-size: 28px; 
            margin: 2px 0 0 0;
            line-height: 1.1;
        }

        /* --- CUERPO --- */
        .etq-cuerpo {
            font-size: 28px; 
            line-height: 1.3;
            margin-bottom: 2mm;
        }

        .etq-cuerpo p {
            margin: 0 0 4px 0;
            display: block; 
            text-align: left;
        }

        .etq-label {
            font-weight: 900;
        }

        /* --- TABLA --- */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 28px; 
            margin: 2mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 3px solid #000;
            border-top: 3px solid #000;
            padding: 2mm 0;
            font-size: 28px;
        }

        .etq-tabla td {
            padding: 2mm 0;
            vertical-align: top;
            word-wrap: break-word;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* --- TOTALES --- */
        .etq-totales {
            font-size: 28px;
            border-top: 4px dashed #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 2mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: 900;
            font-size: 45px; /* El total GIGANTE */
            border-top: 4px solid #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }
    </style>
</head>
<body>

    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
