{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        @page {
            size: 58mm auto;
            margin: 0; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* Fuente base: TODO EL TEXTO SERÁ DE 28px */
        body {
            font-family: 'Consolas', 'Courier New', monospace; 
            font-weight: bold;
            text-transform: uppercase; 
            font-size: 28px; /* Tamaño del encabezado de la tabla aplicado a todo */
            color: #000;
            background: #ffffff; 
            margin: 0 !important; 
            padding: 0 !important;
            width: 100% !important; 
        }

        .hoja {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .etiqueta { 
            width: 100%;      
            background: #ffffff;
            padding: 1mm; 
            margin: 0; 
            display: flex;
            flex-direction: column;
        }

        /* Cabecera de la empresa */
        .etq-header {
            text-align: center;
            border-bottom: 4px dashed #000;
            padding-bottom: 3mm;
            margin-bottom: 3mm;
        }

        .etq-empresa {
            font-size: 36px; /* Un poco más grande para el nombre */
            font-weight: 900;
            margin: 0;
            line-height: 1;
        }

        .etq-sub {
            font-size: 36px; /* Mismo tamaño base */
            margin: 4px 0 0 0;
            line-height: 1.1;
        }

        /* Cuerpo */
        .etq-cuerpo {
            font-size: 36px; 
            line-height: 1.2;
        }

        .etq-cuerpo p {
            margin: 0 0 3px 0;
            display: flex;
            justify-content: space-between;
        }

        /* Tabla */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 36px; /* Mismo tamaño base */
            margin: 3mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 3px solid #000;
            border-top: 3px solid #000;
            padding: 2mm 0;
            font-size: 36px; /* Encabezados un poco más grandes para resaltar */
            font-weight: 900; 
        }

        .etq-tabla td {
            padding: 2mm 0;
            vertical-align: top;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            font-size: 36px;
            border-top: 4px dashed #000;
            padding-top: 3mm;
            margin-top: 3mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 2mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: 900;
            font-size: 36px; /* El total final resalta aún más */
            border-top: 3px solid #000;
            padding-top: 3mm;
            margin-top: 3mm;
        }
    </style>
</head>
<body>

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
