{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        @page {
            size: 58mm auto;
            margin: 0; 
        }

        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* Letra base ENORME */
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            color: #000;
            background: #ffffff; 
            margin: 0 !important; 
            padding: 0 !important;
            width: 100% !important; 
            font-size: 28px; /* Letra gigante */
        }

        .hoja {
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .etiqueta { 
            width: 100%;      
            background: #ffffff;
            padding: 1mm 2mm; /* Mínimo espacio interno */
            margin: 0; 
            display: flex;
            flex-direction: column;
        }

        /* --- CABECERA --- */
        .etq-header {
            text-align: center;
            border-bottom: 3px dashed #000;
            padding-bottom: 3mm;
            margin-bottom: 3mm;
        }

        .etq-logo {
            /* Forzamos un logo GIGANTE */
            height: 90px; 
            width: auto;
            max-width: 100%;
            margin-bottom: 5px;
            display: inline-block;
        }

        .etq-empresa {
            font-size: 34px; /* Empresa gigante */
            font-weight: 900;
            margin: 0;
            line-height: 1;
        }

        .etq-sub {
            font-size: 22px; 
            margin: 3px 0 0 0;
            line-height: 1.1;
        }

        /* --- CUERPO --- */
        .etq-cuerpo {
            font-size: 24px; 
            line-height: 1.3;
            margin-bottom: 3mm;
        }

        .etq-cuerpo p {
            margin: 0 0 3px 0;
            display: block; 
            text-align: left;
        }

        .etq-label {
            font-weight: 900;
        }

        /* --- TABLA --- */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            font-size: 24px; 
            margin: 3mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 3px solid #000;
            border-top: 3px solid #000;
            padding: 2mm 0;
            font-size: 22px;
        }

        .etq-tabla td {
            padding: 2mm 0;
            vertical-align: top;
            word-wrap: break-word;
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* --- TOTALES --- */
        .etq-totales {
            font-size: 24px;
            border-top: 3px dashed #000;
            padding-top: 3mm;
            margin-top: 3mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 2mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: 900;
            font-size: 34px; /* Total GIGANTE */
            border-top: 3px solid #000;
            padding-top: 3mm;
            margin-top: 3mm;
        }
    </style>
</head>
<body>

    <!-- Las etiquetas -->
    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
