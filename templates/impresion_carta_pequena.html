{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Comprobante{% endblock %}</title>
    <style>
        /* Forzamos un tamaño de letra base */
        html {
            font-size: 24px; /* ¡GIGANTE! Todo se basará en esto */
        }

        body {
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold;
            text-transform: uppercase;
            color: #000;
            background: #ffffff; 
            margin: 0; 
            padding: 0;
            width: 100%;
        }

        /* Hacemos que TODO herede el mismo tamaño */
        * {
            font-size: inherit !important;
            box-sizing: border-box;
        }

        .hoja, .etiqueta {
            width: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .etiqueta {
            padding: 2mm 1mm; /* Mínimo margen interno */
        }

        /* Cabecera */
        .etq-header {
            text-align: center;
            border-bottom: 3px dashed #000;
            padding-bottom: 2mm;
            margin-bottom: 2mm;
        }

        .etq-logo {
            height: 60px; 
            max-width: 100%;
            margin-bottom: 5px;
        }

        .etq-empresa {
            font-weight: 900;
            margin: 0;
            /* Aquí NO ponemos font-size, hereda el de html (24px) */
        }

        .etq-sub {
            margin: 2px 0 0 0;
        }

        /* Cuerpo */
        .etq-cuerpo {
            margin-bottom: 2mm;
        }

        .etq-cuerpo p {
            margin: 0 0 3px 0;
            display: block; 
        }

        /* Tabla: Forzada a tener el mismo tamaño */
        .etq-tabla {
            width: 100%;
            border-collapse: collapse;
            margin: 2mm 0;
        }

        .etq-tabla th {
            text-align: left;
            border-bottom: 3px solid #000;
            border-top: 3px solid #000;
            padding: 1.5mm 0;
        }

        .etq-tabla td {
            padding: 1.5mm 0;
            vertical-align: top;
            /* Evita que palabras largas rompan la tabla */
            word-wrap: break-word; 
        }

        .etq-tabla .right { text-align: right; }
        .etq-tabla .center { text-align: center; }

        /* Totales */
        .etq-totales {
            border-top: 3px dashed #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }

        .etq-totales .fila {
            display: flex;
            justify-content: space-between;
            margin: 1.5mm 0;
        }

        .etq-totales .fila.total-final {
            font-weight: 900;
            border-top: 3px solid #000;
            padding-top: 2mm;
            margin-top: 2mm;
        }
    </style>
</head>
<body>

    <div class="hoja">
        {% block etiquetas %}{% endblock %}
    </div>

</body>
</html>
