<!-- templates/pedidos/_tabla_libros.html -->
<div class="table-responsive">
    <table class="table table-hover mb-0 align-middle datatable" id="tabla-libros">
        <thead class="table-light">
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Páginas</th>
                <th>Precio Base</th>
                <th>Pedidos</th>
                <th class="text-end no-sort">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for libro in libros %}
            <tr>
                <td><strong>{{ libro.titulo }}</strong></td>
                <td>{{ libro.autor|default:"—" }}</td>
                <td>{{ libro.paginas }}</td>
                <td class="fw-bold text-primary">${{ libro.precio|floatformat:2 }}</td>
                <td>
                    <span class="badge bg-secondary rounded-pill">{{ libro.num_pedidos }}</span>
                </td>
                <td class="text-end">
                    <a href="{% url 'pedidos:editar_libro' libro.id %}" class="btn btn-sm btn-outline-primary" title="Editar">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a href="{% url 'pedidos:fabricar_stock' libro.id %}" class="btn btn-sm btn-outline-success ms-1" title="Fabricar para Stock">
                        <i class="bi bi-hammer"></i> Fabricar para Stock
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="6" class="text-center text-muted py-5">
                <i class="bi bi-book fs-1 d-block mb-2"></i>
                No se encontraron libros en el catálogo.
            </td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
