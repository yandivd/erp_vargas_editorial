{% extends 'impresion_carta_pequena.html' %}
{% load static %}

{% block title %}Etiqueta #{{ pedido.referencia_externa|default:pedido.id }}{% endblock %}

{% block etiquetas %}
<div class="etiqueta" style="padding: 3mm; justify-content: space-between; align-items: center; text-align: center; border: 1px solid #ccc;">

    <!-- LOGO CENTRADO -->
    <div style="margin-top: 2mm;">
        <img src="{% static 'img/logo.png' %}" alt="Logo" style="max-height: 15mm; max-width: 80%; object-fit: contain;">
    </div>

    <!-- TÍTULO DEL LIBRO (Lo más grande y visual) -->
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 2mm 0;">
        <h2 style="font-size: 14pt; font-weight: bold; line-height: 1.1; margin: 0; color: #000; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;">
            {{ pedido.libro.titulo }}
        </h2>
    </div>

    <!-- REFERENCIA DEL PEDIDO (Destacada abajo) -->
    <div style="width: 100%; border-top: 2px dashed #000; padding-top: 2mm; margin-bottom: 1mm;">
        <p style="font-size: 6pt; text-transform: uppercase; color: #555; margin: 0 0 1mm 0;">Pedido</p>
        <p style="font-size: 18pt; font-weight: bold; margin: 0; color: #c0392b; line-height: 1;">
            #{{ pedido.referencia_externa|default:pedido.id }}
        </p>
    </div>

</div>
{% endblock %}
