{% extends 'base.html' %}

{% block title %}Catálogo - Vargas Editorial{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-0 fw-bold"><i class="bi bi-book text-primary"></i> Catálogo de Libros</h2>
        <p class="text-muted mb-0">Total de libros registrados: {{ total_libros }}</p>
    </div>
    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevoLibro">
        <i class="bi bi-plus-lg"></i> Nuevo Libro
    </button>
</div>

<!-- PANEL DE FILTROS -->
<div class="card card-kpi p-3 mb-4">
    <form method="get" class="row g-3" id="formFiltrosLibros">
        <div class="col-md-10">
            <label class="form-label small fw-bold text-muted">Buscar Libro</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                <input type="text" name="q" id="inputBuscarLibro" class="form-control" placeholder="Escribe el título o autor..." value="{{ busqueda }}">
            </div>
        </div>
    </form>
</div>

<!-- CONTENEDOR DE LA TABLA -->
<div class="card card-kpi" id="contenedor-tabla-libros">
    {% include 'pedidos/_tabla_libros.html' %}
</div>

<!-- Modal Nuevo Libro (igual que antes) -->
<div class="modal fade" id="modalNuevoLibro" tabindex="-1">
    <!-- ... contenido del modal ... -->
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    // ==========================================
    // 1. BÚSQUEDA AJAX Y PAGINACIÓN
    // ==========================================
    const formFiltros = document.getElementById('formFiltrosLibros');
    const contenedor = document.getElementById('contenedor-tabla-libros');
    
    if (formFiltros && contenedor) {
        const searchInput = formFiltros.querySelector('input[type="text"]');

        function actualizarTabla() {
            contenedor.style.opacity = '0.5';
            const formData = new FormData(formFiltros);
            const params = new URLSearchParams(formData).toString();
            
            fetch(`{% url 'pedidos:lista_libros_ajax' %}?${params}`)
                .then(response => response.json())
                .then(data => {
                    contenedor.innerHTML = data.html;
                    contenedor.style.opacity = '1';
                    engancharPaginacion();
                })
                .catch(err => {
                    console.error(err);
                    contenedor.style.opacity = '1';
                });
        }

        function engancharPaginacion() {
            // BUSCAMOS EL ID CORRECTO: paginacion-ajax-libros
            const paginacion = document.getElementById('paginacion-ajax-libros');
            if (!paginacion) return;
            
            paginacion.querySelectorAll('a.page-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    const page = this.getAttribute('data-page');
                    if (!page) return;
                    
                    const formData = new FormData(formFiltros);
                    formData.set('page', page);
                    const params = new URLSearchParams(formData).toString();
                    
                    contenedor.style.opacity = '0.5';
                    fetch(`{% url 'pedidos:lista_libros_ajax' %}?${params}`)
                        .then(r => r.json())
                        .then(data => {
                            contenedor.innerHTML = data.html;
                            contenedor.style.opacity = '1';
                            engancharPaginacion(); // Reconecta los botones
                        });
                });
            });
        }

        // Escuchar búsqueda
        if (searchInput) {
            let timer;
            searchInput.addEventListener('input', () => {
                clearTimeout(timer);
                timer = setTimeout(actualizarTabla, 500);
            });
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    clearTimeout(timer);
                    actualizarTabla();
                }
            });
        }

        // Conectar botones al cargar la página
        engancharPaginacion();
    }

    // ==========================================
    // 2. CÁLCULO DE PRECIO AUTOMÁTICO (Nuevo Libro)
    // ==========================================
    const inputPaginas = document.getElementById('nuevo_libro_paginas');
    const inputPrecio = document.getElementById('nuevo_libro_precio');
    const aviso = document.getElementById('precio-aviso');

    if (inputPaginas && inputPrecio) {
        inputPaginas.addEventListener('input', function() {
            const paginas = this.value;
            if (paginas && paginas >= 1) {
                aviso.style.display = 'block';
                fetch(`/pedidos/calcular-costo/?paginas=${paginas}&lleva_scotch=false`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.ok) {
                            inputPrecio.value = data.costo.precio_sugerido;
                        }
                        aviso.style.display = 'none';
                    })
                    .catch(() => {
                        aviso.style.display = 'none';
                    });
            } else {
                inputPrecio.value = 0;
                aviso.style.display = 'none';
            }
        });
    }
});
</script>
{% endblock %}
